name: "CloudDocs Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: "us-east-1"
  TF_VERSION: "1.7.5"
  TF_WORKING_DIR: "./terraform"

jobs:
  # ===========================================================================
  # 1. LINT & SYNTAX VALIDATION
  # ===========================================================================
  lint-and-validate:
    name: "Terraform Lint & Validate"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Check Terraform Formatting"
        run: terraform fmt -check -recursive ${{ env.TF_WORKING_DIR }}

      - name: "Terraform Init (Dry-Run / No Backend)"
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init -backend=false

      - name: "Terraform Validate"
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} validate

  # ===========================================================================
  # 2. TERRAFORM PLAN (ON PULL REQUEST & MAIN PUSH)
  # ===========================================================================
  terraform-plan:
    name: "Terraform Plan"
    needs: [lint-and-validate]
    runs-on: ubuntu-latest
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true # Allows plan syntax dry-run even before AWS credentials are wired

      - name: "Terraform Init"
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init -input=false

      - name: "Terraform Plan"
        id: plan
        run: |
          terraform -chdir=${{ env.TF_WORKING_DIR }} plan -no-color -out=tfplan \
            -var="project_name=clouddocs" \
            -var="environment=prod"
        continue-on-error: true

      - name: "Upload Plan Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

      - name: "Post Plan Summary to Pull Request"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### CloudDocs Infrastructure Plan Results
            - **Status**: \`${{ steps.plan.outcome }}\`
            - **Terraform Directory**: \`${{ env.TF_WORKING_DIR }}\`
            - **Environment**: \`prod\`
            
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # ===========================================================================
  # 3. TERRAFORM APPLY (AUTOMATIC OR MANUAL GATE ON MERGE TO MAIN)
  # ===========================================================================
  terraform-apply:
    name: "Terraform Apply"
    needs: [terraform-plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Download Plan Artifact"
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: "Terraform Init"
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init -input=false

      - name: "Terraform Apply"
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} apply -auto-approve tfplan
